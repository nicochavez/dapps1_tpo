# ============================================================
# PROD profile (Railway). Self-contained: NO secrets here.
# Every sensitive value comes from an environment variable set
# in Railway → service → Variables. Activated with
# SPRING_PROFILES_ACTIVE=prod.
# ============================================================
spring.application.name=backend

# --- Server ---
# Railway injects PORT; fall back to 8080 for local prod runs.
server.port=${PORT:8080}

# --- Datasource (Supabase Postgres) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# --- Multipart upload ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=-1
# RegisterRequest sends 14 form fields = 14 parts; Tomcat default cap is 10
server.tomcat.max-part-count=50

# --- Mail (Gmail SMTP). Secrets via env vars. ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# --- JWT (HS256). Secret must be >= 32 bytes; set APP_JWT_SECRET in Railway. ---
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- Storage (Railway Storage Bucket, S3-compatible). Secrets via env vars. ---
app.storage.bucket=${AWS_S3_BUCKET_NAME:}
app.storage.endpoint=${AWS_ENDPOINT_URL}
app.storage.region=${AWS_DEFAULT_REGION:auto}
app.storage.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.get-ttl-seconds=86400
app.storage.put-ttl-seconds=600
