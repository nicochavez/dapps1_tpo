# ============================================================
# PROD profile (Railway). Self-contained: NO secrets here.
# Every sensitive value comes from an environment variable set
# in Railway → service → Variables. Activated with
# SPRING_PROFILES_ACTIVE=prod.
# ============================================================
spring.application.name=backend

# --- Server ---
# Railway injects PORT; fall back to 8080 for local prod runs.
server.port=${PORT:8080}

# --- Datasource (Supabase Postgres) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# --- Multipart upload ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=-1
# RegisterRequest sends 14 form fields = 14 parts; Tomcat default cap is 10
server.tomcat.max-part-count=50

# --- Mail (Brevo HTTP API). Railway bloquea SMTP saliente (25/465/587/2525) en Hobby,
#     así que se envía por HTTPS. Secrets via env vars.
#     MAIL_FROM debe ser un remitente verificado en Brevo (single sender). ---
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:BidFlow}

# --- JWT (HS256). Secret must be >= 32 bytes; set APP_JWT_SECRET in Railway. ---
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- Storage (Railway Storage Bucket, S3-compatible). Secrets via env vars. ---
app.storage.bucket=${AWS_S3_BUCKET_NAME:}
app.storage.endpoint=${AWS_ENDPOINT_URL}
app.storage.region=${AWS_DEFAULT_REGION:auto}
app.storage.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.get-ttl-seconds=86400
